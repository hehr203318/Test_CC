<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生命游戏</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .status-bar {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 28px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .status-item { color: #94a3b8; }
    .status-item span { color: #e2e8f0; margin-left: 4px; }
    .status-running { color: #22c55e; }
    .status-paused  { color: #64748b; }

    canvas {
      display: block;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: crosshair;
      image-rendering: pixelated;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 9px 22px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
      min-width: 96px;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary.running { background: #f59e0b; }
    .btn-primary.running:hover { background: #d97706; }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-secondary:hover { background: #334155; color: #e2e8f0; }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

    .presets {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-label {
      font-size: 0.75rem;
      color: #475569;
      align-self: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .btn-preset {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #64748b;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-preset:hover {
      border-color: #3b82f6;
      color: #93c5fd;
      background: #1d4ed820;
    }

    .speed-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #64748b;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 140px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
    }

    .speed-val {
      color: #e2e8f0;
      font-weight: 600;
      min-width: 48px;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #334155;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>生命游戏</h1>
<p class="subtitle">Conway's Game of Life</p>

<div class="status-bar">
  <div class="status-item">代数<span id="genCount">0</span></div>
  <div class="status-item">存活<span id="aliveCount">0</span></div>
  <div id="runStatus" class="status-paused">● 已暂停</div>
</div>

<canvas id="canvas"></canvas>

<div class="controls">
  <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">播放</button>
  <button class="btn btn-secondary" id="stepBtn" onclick="step()">单步</button>
  <button class="btn btn-secondary" onclick="randomize()">随机</button>
  <button class="btn btn-secondary" onclick="clearGrid()">清空</button>
</div>

<div class="presets">
  <span class="preset-label">预设</span>
  <button class="btn-preset" onclick="loadPreset('glider')">滑翔机</button>
  <button class="btn-preset" onclick="loadPreset('blinker')">闪烁器</button>
  <button class="btn-preset" onclick="loadPreset('toad')">蟾蜍</button>
  <button class="btn-preset" onclick="loadPreset('beacon')">烽火台</button>
  <button class="btn-preset" onclick="loadPreset('pulsar')">脉冲星</button>
  <button class="btn-preset" onclick="loadPreset('glidergun')">滑翔机炮</button>
</div>

<div class="speed-row">
  <span>速度</span>
  <input type="range" id="speedSlider" min="1" max="4" value="2" oninput="updateSpeed()">
  <span class="speed-val" id="speedLabel">5 代/秒</span>
</div>

<div class="hint">鼠标点击或拖动绘制/擦除细胞</div>

<script>
  const COLS = 60, ROWS = 40, CELL = 16;
  const SPEEDS = [1, 5, 10, 20];

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;

  let grid = makeGrid();
  let generation = 0;
  let running = false;
  let speedIdx = 1; // index into SPEEDS
  let lastTime = 0;
  let drawMode = null; // true=draw, false=erase
  let isMouseDown = false;

  function makeGrid() {
    return Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
  }

  // ── Simulation ──────────────────────────────────────────────────

  function countNeighbors(r, c) {
    let n = 0;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++)
        if (dr || dc) {
          const nr = (r + dr + ROWS) % ROWS;
          const nc = (c + dc + COLS) % COLS;
          if (grid[nr][nc]) n++;
        }
    return n;
  }

  function nextGeneration() {
    const next = grid.map((row, r) =>
      row.map((cell, c) => {
        const n = countNeighbors(r, c);
        return cell ? (n === 2 || n === 3) : n === 3;
      })
    );
    grid = next;
    generation++;
  }

  // ── Rendering ───────────────────────────────────────────────────

  function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, canvas.height);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(canvas.width, r * CELL);
      ctx.stroke();
    }

    // Alive cells
    ctx.fillStyle = '#3b82f6';
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (grid[r][c])
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 1, CELL - 1);
  }

  function updateStatus() {
    const alive = grid.flat().filter(Boolean).length;
    document.getElementById('genCount').textContent = generation;
    document.getElementById('aliveCount').textContent = alive;
    const el = document.getElementById('runStatus');
    el.className = running ? 'status-running' : 'status-paused';
    el.textContent = running ? '● 运行中' : '● 已暂停';
    document.getElementById('playBtn').textContent = running ? '暂停' : '播放';
    document.getElementById('playBtn').className = 'btn btn-primary' + (running ? ' running' : '');
    document.getElementById('stepBtn').disabled = running;
  }

  // ── Loop ────────────────────────────────────────────────────────

  function loop(timestamp) {
    requestAnimationFrame(loop);
    if (running) {
      const interval = 1000 / SPEEDS[speedIdx];
      if (timestamp - lastTime >= interval) {
        nextGeneration();
        lastTime = timestamp;
        updateStatus();
      }
    }
    draw();
  }

  // ── Controls ────────────────────────────────────────────────────

  function togglePlay() {
    running = !running;
    if (running) lastTime = performance.now();
    updateStatus();
  }

  function step() {
    if (running) return;
    nextGeneration();
    updateStatus();
  }

  function randomize() {
    grid = makeGrid().map(row => row.map(() => Math.random() < 0.3));
    generation = 0;
    updateStatus();
  }

  function clearGrid() {
    grid = makeGrid();
    generation = 0;
    running = false;
    updateStatus();
  }

  function updateSpeed() {
    speedIdx = parseInt(document.getElementById('speedSlider').value) - 1;
    document.getElementById('speedLabel').textContent = SPEEDS[speedIdx] + ' 代/秒';
  }

  // ── Mouse drawing ───────────────────────────────────────────────

  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    return [Math.floor(y / CELL), Math.floor(x / CELL)];
  }

  canvas.addEventListener('mousedown', e => {
    isMouseDown = true;
    const [r, c] = cellFromEvent(e);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    drawMode = !grid[r][c];
    grid[r][c] = drawMode;
    updateStatus();
  });

  canvas.addEventListener('mousemove', e => {
    if (!isMouseDown) return;
    const [r, c] = cellFromEvent(e);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    grid[r][c] = drawMode;
    updateStatus();
  });

  window.addEventListener('mouseup', () => { isMouseDown = false; });

  // ── Presets ─────────────────────────────────────────────────────

  const PRESETS = {
    glider: [
      [0,1],[1,2],[2,0],[2,1],[2,2]
    ],
    blinker: [
      [0,0],[0,1],[0,2]
    ],
    toad: [
      [0,1],[0,2],[0,3],[1,0],[1,1],[1,2]
    ],
    beacon: [
      [0,0],[0,1],[1,0],[1,1],[2,2],[2,3],[3,2],[3,3]
    ],
    pulsar: (() => {
      const cells = [];
      const cols = [2,3,4,8,9,10];
      const rows = [0,5,7,12];
      for (const r of rows) for (const c of cols) cells.push([r, c]);
      const cols2 = [0,5,7,12];
      const rows2 = [2,3,4,8,9,10];
      for (const r of rows2) for (const c of cols2) cells.push([r, c]);
      return cells;
    })(),
    glidergun: [
      [0,24],
      [1,22],[1,24],
      [2,12],[2,13],[2,20],[2,21],[2,34],[2,35],
      [3,11],[3,15],[3,20],[3,21],[3,34],[3,35],
      [4,0],[4,1],[4,10],[4,16],[4,20],[4,21],
      [5,0],[5,1],[5,10],[5,14],[5,16],[5,17],[5,22],[5,24],
      [6,10],[6,16],[6,24],
      [7,11],[7,15],
      [8,12],[8,13]
    ]
  };

  function loadPreset(name) {
    clearGrid();
    running = false;
    const cells = PRESETS[name];
    // Center the pattern
    const maxR = Math.max(...cells.map(([r]) => r));
    const maxC = Math.max(...cells.map(([, c]) => c));
    const offR = Math.floor((ROWS - maxR) / 2);
    const offC = Math.floor((COLS - maxC) / 2);
    for (const [r, c] of cells) {
      const nr = r + offR, nc = c + offC;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS)
        grid[nr][nc] = true;
    }
    updateStatus();
  }

  // ── Init ─────────────────────────────────────────────────────────

  updateSpeed();
  updateStatus();
  requestAnimationFrame(loop);
</script>
</body>
</html>
